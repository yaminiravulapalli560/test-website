<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body style="margin:0; display:flex; flex-direction:column; min-height:100vh;">
    <div id="header"></div>
    <div style="flex:1; padding:40px; text-align:center;">
        <h1 style="text-align:center;">Login</h1>
        <form onsubmit="return validateLogin(event)">
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br>
            <div id="emailError" style="color:red; font-size:13px;"></div>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br>
            <div id="passwordError" style="color:red; font-size:13px;"></div>
            <button type="submit">Login</button>
        </form>
        <div id="loginMessage" style="font-size:14px; margin-top:10px;"></div>
        <a href="signup.html" style="color:black;">Not having an account?<br>Signup!</a>
    </div>
    <div id="footer"></div>
    <script src="script.js"></script>
</body>

</html>
